# Hanai is a Web-surface bundle. The recommended installer composes it into a
# dedicated `mode-investment` profile after `dsh-web-app`, leaving `web` intact.
- id: ui-settings-models
  # Hanai owns the credential and model setup experience. Disabling the stock
  # models surface also prevents its first-run modal from covering Workbench.
  disabled: true

- insert:
    - id: mode-investment
      name: dsh-mode-investment
      inject: [connection, apiProxy, sessions, agentDefaultModel]
      config:
        dataRoot: !!js process.env.DSH_MODE_INVESTMENT_HOME
        requestTimeoutMs: 12000
        reportMinChars: 800
